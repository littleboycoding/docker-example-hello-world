name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

jobs:
  
  build:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: ghcr.io/${{ github.repository_owner }}/hello-world:latest
        push: true
        
    - name: Notify via ntfy
      run: curl -d "Build ghcr.io/${{ github.repository_owner }}/hello-world:latest successfully" ntfy.sh/gh-action-ici

    - name: Setup SSH known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
    - name: Stack deploy
      env:
        DOCKER_HOST: ${{ secrets.SSH_HOST }}
        IMAGE: ghcr.io/${{ github.repository_owner }}/hello-world:latest
      run: docker stack deploy --with-registry-auth --prune -d -c ./compose.yml hello-world
        
    - name: Notify via ntfy
      run: curl -d "Deployed ghcr.io/${{ github.repository_owner }}/hello-world:latest successfully (${{ inputs.environment }})" ntfy.sh/gh-action-ici
