name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build/Push auth image
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: ghcr.io/${{ github.repository_owner }}/hello-world:latest
        push: true
        
    - name: Notify via ntfy
      run: curl -d "Build and push ghcr.io/${{ github.repository_owner }}/hello-world:latest successfully" ntfy.sh/gh-action-ici
